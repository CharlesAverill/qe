    label: "SEPIA: Search for Proofs Using Inferred Automata"
    year: 2015
    authors:
      - Thomas Grandsen
      - Neil Walkinshaw
      - Rajeev Raman
    conf: CADE
    cluster: ClassicalML
    url: https://link.springer.com/chapter/10.1007/978-3-319-21401-6_16
    notes: |
      Uses MINT to infer a FSM from proof traces
      SEPIA FSMs are essentially search trees of already-seen proofs
      Solves ~15% of theorems on average, many 0% cases for certain theory libraries
      Doesn't seem like it would scale well (computationally) with more acquired knowledge
  - key: tactictoe
    label: "TacticToe: Learning to Prove with Tactics"
    year: 2018
    authors:
      - Thibault Gautier
      - Cezary Kaliszyk
      - Josef Urban
      - Ramana Kumar
      - Michael Norrish
    conf: JAUR
    cluster: ClassicalML
    url: https://link.springer.com/article/10.1007/s10817-020-09580-x
    notes: |
      Uses K-NN for lemma selection
      Claims to solve 66% of HOL Light's standard library theorems, no info on train/test split
      Authors pre-select tactics for model to choose from
  - key: holist
    label: "HOList: An Environment for Machine Learning of Higher-Order Theorem Proving"
    year: 2019
    authors:
      - Kshitij Bansal
      - Sarah M. Loos
      - Markus N. Rabe
      - Christian Szegedy
      - Stewart Wilcox
    conf: PMLR
    cluster: Environment
    url: https://arxiv.org/abs/1904.03241
    notes: |
      Provides instrumented HOL Light environment for RL Theorem Prover training
      30k theorems in dataset, splits respect that goals descended from one another will be similar, but doesn't recognize that theorems in train/test may be similar as in LeanDojo
      Presents an example tactic prediction implementation, claims ~35% accuracy
  - key: gamepad
    label: "GamePad: A Learning Environment for Theorem Proving"
    year: 2019
    authors:
      - Daniel Huang
      - Prafulla Dhariwal
      - Dawn Song
      - Ilya Sutskever
    conf: ICLR
    cluster: Environment
    url: https://arxiv.org/abs/1806.00608
    notes: |
      System for synthesizing proofs for supervised ML training data
      Considers tactic prediction as well as *position prediction*, predicting the number of tactics remaining
      Encodes proof term ASTs as inputs for RNN learning
      95% proof accuracy on synthesized algebraic rewriting problems
      40-60% proof accuracy on Feit-Thompson proof dataset using various ML architectures - likely case of test set poisoning
      Tactic prediction dataset seems over-engineered, giving special treatment to specific tactics such as reflexivity
