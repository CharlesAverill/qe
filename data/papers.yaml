  - key: pact
    label: "Proof Artifact Co-training for Theorem Proving with Language Models"
    year: 2022
    authors:
      - Jesse Michael Han
      - Jason Rute
      - Yuhuai Wu
      - Edward W. Ayers
      - Stanislas Polu
    conf: ICLR
    cluster: LLMAutomation
    url: https://arxiv.org/abs/2102.06203
    notes: |
      Proposes a methodology for extracting LLM training data from kernel-level proof terms for the purposes of tactic prediction
      PACT includes several language modeling tasks, e.g., next lemma prediction, type prediction, theorem naming, etc.
      Instruments Lean s.t. LLMs can interface directly with kernel, so no textual tactic prediction
      Training/test split is split according to the hash of a theorem name, doesn't approach the issues raised by LeanDojo, thus the 35+% success rate is suspicious
