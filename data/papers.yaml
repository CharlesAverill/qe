    label: "DeepMath - Deep Sequence Models for Premise Selection"
    year: 2016
    authors:
      - Alex A. Alemi
      - Francois Chollet
      - Niklas Een
      - Geoffrey Irving
      - Christian Szegedy
      - Josef Urban
    conf: arXiv
    cluster: ClassicalML
    url: https://arxiv.org/abs/1606.04442
    notes: |
      First neural network approach to premise selection without hand-engineered features
      Training data is theorems in Mizar known to be provable by ATPs, random train/test split
      Evaluate LSTMs, CNNs, GRUs as embedding layers for the core network, found that CNNs > CNN-LSTMs = GRUs > LSTMs
      CNNs achieved 30-70% accuracy rate for Mizar theorems known to be provable by ATPs
