nodes:
  - key: tactok
    label: "TacTok: semantics-aware proof synthesis"
    year: 2020
    authors:
      - Emily First
      - Yuriy Brun
      - Arjun Guha
    conf: OOPSLA
    url: https://dl.acm.org/doi/10.1145/3428299
    cluster: LLM
    notes: |
      Proof synthesis technique that looks at proof state and semantics to predict next tactic
      Outperforms ASTactic on large Coq projects of 10k+ theorems
      Does not outperform CoqHammer
      Success rate of 12.9%
      Can be used as a complement to ASTactic, CoqHammer, and similar approaches
      Successful at reasoning about higher-order logic where other tools fail
      Not all proofs require expert knowledge of all *tokens* in the proof script, only the tactics
  - key: coqgym
    label: "Learning to Prove Theorems via Interacting with Proof Assistants"
    year: 2019
    authors:
      - Kaiyu Yang
      - Jia Deng
    conf: ICML
    url: https://arxiv.org/abs/1905.09381
    cluster: ClassicalML
    notes: |
      Presents CoqGym - 71k human-written Coq proofs
      Presents ASTactic encoder-decoder model, generates tactic ASTs for proof synthesis
      Solves 12.2% of the theorems in the test set
      Can be combined with SOTA ATPs (SMT solvers and FOL systems) to bump success rate to 30%
  - key: llmsurvey
    label: "Proof Automation with Large Language Models"
    year: 2024
    authors:
      - Minghai Lu
      - Benjamin Delaware
      - Tianyi Zhang
    conf: ASE
    url: https://dl.acm.org/doi/10.1145/3691620.3695521
    cluster: LLM
    notes: |
      Analyzes common errors made by GPTs, discovers that they're good at high-level proof structure but bad at low-level tasks
      Solution: write-then-repair method "PALM" of proof generation that combines LLMs and symbolic approaches
      30-40% success rate on CoqGym using GPT-3/4, Llama-3
  - key: datalog_provenance
    label: "Provenance-guided synthesis of Datalog programs"
    year: 2019
    authors:
      - Mukund Raghothaman
      - Jonathan Mendelson
      - David Zhao
      - Mayur Naik
      - Bernhard Scholz
    conf: POPL
    url: https://dl.acm.org/doi/abs/10.1145/3371130
    cluster: Algorithmic
    notes: |
      Generates datalog programs based on input-output specifications
      If a counterexample is found for the generated program, the system computes "why-provenenance" that details why the specification is wrong
      With SAT solving, the specification is updated with more constraints to fix the errors
  - key: sisyphus
    label: "Mostly Automated Proof Repair for Verified Libraries"
    year: 2023
    authors:
      - Kiran Gopinathan
      - Mayank Keoliya
      - Ilya Sergey
    conf: PLDI
    url: https://dl.acm.org/doi/10.1145/3591221
    cluster: LLM
    notes: |
      When updating a program but keeping its specification the same, Sisyphus repairs the proof's invariants to match the new code
  - key: leandojo
    label: "LeanDojo: Theorem Proving with Retrieval-Augmented Language Models"
    year: 2023
    authors:
      - Kaiyu Yang
      - Aidan Swope
      - Alex Gu
      - Rahul Chalamala
      - Peiyang Song
      - Shixing Yu
      - Saad Godil
      - Ryan Prenger
      - Anima Anandkumar
    conf: NeurIPS
    url: https://arxiv.org/abs/2306.15626
    cluster: Environment
    notes: |
      RAG network using fine-grained annotations to enhance premise selection during tactic prediction
      Also exposes that a simple train/test split misrepresents the success of these models, as many proofs and theorems are similar to one another, so the test set may be polluted with nearly-identical samples from the training set
      Better approach to dataset splitting is to ensure that test set proofs use at least one premise that is never used in a training set proof
  - key: malarea
    label: "MaLARea: a Metasystem for Automated Reasoning in Large Theories"
    year: 2007
    authors:
      - Josef Urban
    conf: ESARLT
    url: https://www.researchgate.net/publication/220806094_MaLARea_a_Metasystem_for_Automated_Reasoning_in_Large_Theories
    cluster: ClassicalML
    notes: |
      First to integrate modern data-driven ML into ATP, won LTB in CASC-2007
      Depends on the SNoW linear classification model
  - key: rippling
    label: "Rippling: a heuristic for guiding inductive proofs"
    year: 1993
    authors:
      - Alan Bundy
      - Andrew Stevens
      - Frank van Harmelen
      - Andrew Ireland
      - Alan Smaill
    conf: AIJ
    url: https://www.cs.vu.nl/~frankh/postscript/AIJ92.pdf
    cluster: Algorithmic
    notes: |
      Extremely significant symbolic AI approach to inductive proof automation, used extensively afterward
  - key: pact
    label: "Proof Artifact Co-training for Theorem Proving with Language Models"
    year: 2021
    authors:
      - Jesse Michael Han
      - Jason Rute
      - Yuhuai Wu
      - Edward W. Ayers
      - Stanislas Polu
    conf: ICLR
    cluster: LLM
    url: https://arxiv.org/abs/2102.06203
    notes: |
      Proposes a methodology for extracting LLM training data from kernel-level proof terms for the purposes of tactic prediction
      PACT includes several language modeling tasks, e.g., next lemma prediction, type prediction, theorem naming, etc
      Instruments Lean s.t. LLMs can interface directly with kernel, so no textual tactic prediction
      Training/test split is split according to the hash of a theorem name, doesn't approach the issues raised by LeanDojo, thus the 35+% success rate is suspicious
  - key: rltp
