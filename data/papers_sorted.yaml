  key: gamepad
  label: 'GamePad: A Learning Environment for Theorem Proving'
  notes: 'System for synthesizing proofs for supervised ML training data

    Considers tactic prediction as well as *position prediction*, predicting the number of tactics remaining

    Encodes proof term ASTs as inputs for RNN learning

    95% proof accuracy on synthesized algebraic rewriting problems

    40-60% proof accuracy on Feit-Thompson proof dataset using various ML architectures - likely case of test set poisoning

    Tactic prediction dataset seems over-engineered, giving special treatment to specific tactics such as reflexivity

    '
