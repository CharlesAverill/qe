  key: malarea_full
  label: MaLARea SG1 - Machine Learner for Automated Reasoning with Semantic Guidance
  notes: 'Extends initial MaLARea approach with semantic guidance to achieve better premise selection

    Key insight is that initial approach just used syntactic guidance, so now construct "models" for each premise set to pass into the network as well

    Models consist of a domain (set of objects) and interpretation (semantic meaning of symbols)

    Goal is to find a finite model of current premise set that falsifies the conjecture to prove, ensuring that another axiom is necessary

    Capable of proving ~15 more theorems the non-semantically-guided approach cannot

    '
