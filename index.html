<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Graph Visualization</title>
  <link rel="stylesheet" href="/static/styles.css">
    <script type="importmap">
      {
        "imports": {
          "sigma": "https://cdnjs.cloudflare.com/ajax/libs/sigma.js/3.0.0/sigma.min.js",
          "graphology": "https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js",
          "graphologyLibrary": "https://cdn.jsdelivr.net/npm/graphology-library/dist/graphology-library.min.js"
        }
      } 
    </script>
</head>
<body>
  <div id="container">
    <!-- Graph Container -->
    <div id="graph-wrapper">
      <div id="graph-container"></div>
      
      <!-- Loading State -->
      <div id="loading" class="loading-overlay">
        <div class="loading-content">
          <div class="spinner"></div>
          <p>Loading graph...</p>
        </div>
      </div>

      <!-- Floating Controls -->
      <div class="controls">
        <button id="zoom-fit" class="control-btn">
          <span class="icon">🔍</span>
          Zoom to Fit
        </button>
        <button id="reset-layout" class="control-btn">
          <span class="icon">↻</span>
          Reset Layout
        </button>
      </div>

      <!-- Legend -->
      <div class="legend">
        <h3>Clusters</h3>
        <div id="legend-items" class="legend-items">
          <!-- Legend items will be populated by JavaScript -->
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <!-- Search -->
      <div class="search-container">
        <div class="search-wrapper">
          <input
            type="text"
            id="search"
            placeholder="Search papers..."
            autocomplete="off"
          />
          <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Paper Details -->
      <div id="paper-details" class="paper-details">
        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </div>
          <h3>No paper selected</h3>
          <p>Click on any node in the graph to view paper details</p>
        </div>

        <!-- Selected Paper Content (hidden by default) -->
        <div id="paper-content" class="paper-content" style="display: none;">
          <a id="node-title" href="#" target="_blank" rel="noopener noreferrer" class="paper-title"></a>

          <div class="metadata-cards">
            <div class="metadata-card">
              <div class="metadata-label">Authors</div>
              <div id="node-authors" class="metadata-value"></div>
            </div>

            <div class="metadata-row">
              <div class="metadata-card flex-1">
                <div class="metadata-label">Venue</div>
                <div id="node-venue" class="metadata-value"></div>
              </div>
              <div class="metadata-card">
                <div class="metadata-label">Year</div>
                <div id="node-year" class="metadata-value"></div>
              </div>
            </div>

            <div class="metadata-card cluster-card">
              <div class="metadata-label cluster-label">Cluster</div>
              <div class="cluster-content">
                <div id="cluster-dot" class="cluster-dot"></div>
                <span id="node-cluster" class="cluster-name"></span>
              </div>
            </div>
          </div>

          <div id="notes-container" class="notes-container">
            <div class="notes-label">Key Notes</div>
            <ul id="node-notes" class="notes-list"></ul>
          </div>

          <a id="read-paper-btn" href="#" target="_blank" rel="noopener noreferrer" class="read-paper-btn">
            <span>Read Paper</span>
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="/static/graph.js"></script>
</body>
</html>
